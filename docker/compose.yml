name: inventario-formacion

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: inventario-formacion:latest
    container_name: inventario-formacion
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - ../.env
    volumes:
      - inventario_uploads:/var/www/html/public/uploads
    restart: unless-stopped

volumes:
  inventario_uploads:
